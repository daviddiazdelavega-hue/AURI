<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MIGUE">
<meta name="theme-color" content="#0d1b2a">
<title>MIGUE — Asistente Municipal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --blue: #00b4db; --blue2: #0083b0;
  --bg: #0d1b2a; --bg2: #162535; --bg3: rgba(255,255,255,0.06);
  --bdr: rgba(255,255,255,0.1); --txt: #ffffff;
  --txt2: rgba(255,255,255,0.6); --txt3: rgba(255,255,255,0.3);
  --red: #e04444;
}
html, body { height: 100%; background: var(--bg); color: var(--txt); font-family: -apple-system,'Segoe UI',sans-serif; overflow: hidden; }

#ak { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; z-index: 999; }
.ak-icon { font-size: 64px; margin-bottom: 8px; }
.ak-title { font-size: 28px; font-weight: 700; letter-spacing: 3px; color: var(--blue); margin-bottom: 4px; }
.ak-sub { font-size: 13px; color: var(--txt2); text-align: center; margin-bottom: 28px; line-height: 1.7; }
.ak-input { width: 100%; padding: 14px 16px; background: var(--bg3); border: 1px solid var(--bdr); border-radius: 14px; font-size: 14px; color: var(--txt); outline: none; font-family: monospace; margin-bottom: 12px; }
.ak-input:focus { border-color: var(--blue); }
.ak-btn { width: 100%; padding: 15px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--blue2), var(--blue)); color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
.ak-btn:active { opacity: .85; }
.ak-err { color: var(--red); font-size: 12px; margin-top: 8px; text-align: center; min-height: 16px; }
.ak-note { font-size: 11px; color: var(--txt3); text-align: center; margin-top: 16px; line-height: 1.8; }
.ak-link { color: var(--blue); }

#app { display: none; flex-direction: column; height: 100dvh; max-width: 540px; margin: 0 auto; }

#hdr { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; background: var(--bg2); border-bottom: 1px solid var(--bdr); flex-shrink: 0; }
#avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--blue2), var(--blue)); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; flex-shrink: 0; }
#hinfo { flex: 1; }
#hname { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; }
#hsub  { font-size: 11px; color: var(--txt2); margin-top: 1px; }
#wpill { background: var(--bg3); border: 1px solid var(--bdr); border-radius: 20px; padding: 5px 11px; font-size: 13px; white-space: nowrap; }
#abtn  { background: var(--bg3); border: 1px solid var(--bdr); border-radius: 10px; padding: 7px 9px; font-size: 18px; cursor: pointer; color: var(--txt2); }

#agpanel { max-height: 0; overflow: hidden; transition: max-height .3s ease; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--bdr); flex-shrink: 0; }
#agpanel.open { max-height: 210px; overflow-y: auto; }
#aginner { padding: 10px 14px; }
.aglabel { font-size: 11px; font-weight: 600; color: var(--txt2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }
.agitem { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--bdr); border-radius: 10px; padding: 7px 10px; margin-bottom: 5px; font-size: 13px; }
.agtext { flex: 1; }
.agtime { font-size: 11px; color: var(--txt3); white-space: nowrap; }
.agdel  { background: none; border: none; color: var(--red); font-size: 17px; cursor: pointer; padding: 0 2px; }
.agempty { font-size: 12px; color: var(--txt3); padding: 8px 0; text-align: center; }

#msgs { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
.mrow { display: flex; align-items: flex-end; gap: 8px; }
.mrow.user { flex-direction: row-reverse; }
.mavatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--blue2), var(--blue)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.bubble { max-width: 80%; padding: 10px 14px; font-size: 15px; line-height: 1.55; word-break: break-word; border-radius: 18px; }
.bubble.assistant { background: var(--bg3); border: 1px solid var(--bdr); border-radius: 4px 18px 18px 18px; }
.bubble.user { background: linear-gradient(135deg, var(--blue2), var(--blue)); border-radius: 18px 4px 18px 18px; }
.typing { display: flex; gap: 5px; padding: 3px 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--txt2); animation: bop .9s infinite; }
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}

.ecard { margin-top: 8px; max-width: 80%; margin-left: 38px; background: rgba(0,180,219,.08); border: 1px solid rgba(0,180,219,.25); border-radius: 12px; padding: 11px 13px; font-size: 13px; }
.elabel { font-size: 11px; font-weight: 600; color: var(--blue); letter-spacing: .5px; margin-bottom: 6px; }
.efield { color: var(--txt2); margin-bottom: 2px; }
.efield b { color: var(--txt); }
.ebody { color: var(--txt); margin-top: 7px; white-space: pre-wrap; }
.ebtn { margin-top: 9px; display: inline-block; padding: 7px 14px; background: linear-gradient(135deg, var(--blue2), var(--blue)); border: none; border-radius: 20px; color: white; font-size: 12px; font-weight: 600; cursor: pointer; }

#qwrap { padding: 8px 14px; overflow-x: auto; display: flex; gap: 7px; flex-shrink: 0; scrollbar-width: none; border-top: 1px solid var(--bdr); }
#qwrap::-webkit-scrollbar { display: none; }
.qbtn { white-space: nowrap; padding: 6px 12px; background: var(--bg3); border: 1px solid var(--bdr); border-radius: 20px; font-size: 12px; color: var(--txt2); cursor: pointer; }
.qbtn:active { background: rgba(0,180,219,.2); color: white; }

#iarea { display: flex; align-items: center; gap: 9px; padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: var(--bg2); border-top: 1px solid var(--bdr); flex-shrink: 0; }
#micbtn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--bdr); background: var(--bg3); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--txt2); transition: all .2s; }
#micbtn.on { background: rgba(224,68,68,.2); border-color: var(--red); animation: pulse 1.1s infinite; }
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,68,68,.3)}50%{box-shadow:0 0 0 9px rgba(224,68,68,0)}}
#tinput { flex: 1; padding: 11px 15px; background: var(--bg3); border: 1px solid var(--bdr); border-radius: 24px; font-size: 15px; color: var(--txt); outline: none; }
#tinput::placeholder { color: var(--txt3); }
#tinput:focus { border-color: rgba(0,180,219,.45); }
#sendbtn { width: 46px; height: 46px; border-radius: 50%; border: none; background: linear-gradient(135deg, var(--blue2), var(--blue)); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: white; }
#sendbtn:active { opacity: .8; }
#stbar { text-align: center; font-size: 11px; color: var(--txt3); min-height: 15px; padding: 2px 0; flex-shrink: 0; }
</style>
</head>
<body>

<div id="ak">
  <div class="ak-icon">🤖</div>
  <div class="ak-title">MIGUE</div>
  <div class="ak-sub">Asistente personal municipal<br>San Miguel de Tucumán</div>
  <input class="ak-input" id="akinput" type="password" placeholder="Pegá tu API key de Groq (gsk_...)" autocomplete="off" autocorrect="off" spellcheck="false"/>
  <button class="ak-btn" onclick="guardarKey()">Ingresar y comenzar →</button>
  <div class="ak-err" id="akerr"></div>
  <p class="ak-note">Tu clave se guarda solo en este dispositivo.<br>
    Gratis en <a class="ak-link" href="https://console.groq.com" target="_blank">console.groq.com</a> → API Keys → Create API Key</p>
</div>

<div id="app">
  <div id="hdr">
    <div id="avatar">M</div>
    <div id="hinfo">
      <div id="hname">MIGUE</div>
      <div id="hsub">Asistente municipal · Tucumán</div>
    </div>
    <div id="wpill">⏳ clima...</div>
    <button id="abtn" onclick="toggleAg()">📅</button>
  </div>

  <div id="agpanel">
    <div id="aginner">
      <div class="aglabel">📅 Mi Agenda</div>
      <div id="aglist"></div>
    </div>
  </div>

  <div id="msgs"></div>

  <div id="qwrap">
    <button class="qbtn" onclick="enviar('¿Hace frío hoy? ¿Llevo campera?')">🌤️ Clima</button>
    <button class="qbtn" onclick="enviar('¿Qué hora y fecha es?')">🕐 Hora</button>
    <button class="qbtn" onclick="enviar('¿Qué tengo agendado hoy?')">📅 Agenda</button>
    <button class="qbtn" onclick="enviar('¿Qué actividades culturales hay en Tucumán hoy?')">🎭 Actividades</button>
    <button class="qbtn" onclick="enviar('¿Hay calles cortadas en Tucumán hoy?')">🚧 Calles</button>
    <button class="qbtn" onclick="enviar('Quiero hacer una denuncia')">📢 Denuncia</button>
  </div>

  <div id="iarea">
    <button id="micbtn" onclick="toggleVoz()">🎤</button>
    <input id="tinput" type="text" placeholder="Escribí o dictá a MIGUE..." autocomplete="off" onkeydown="if(event.key==='Enter')enviar(this.value)"/>
    <button id="sendbtn" onclick="enviar(document.getElementById('tinput').value)">➤</button>
  </div>
  <div id="stbar"></div>
</div>

<script>
const LAT=-26.8083, LON=-65.2176;
let apiKey="", clima=null, agenda=[], historial=[];

function init(){
  apiKey=localStorage.getItem("migue_groq")||"";
  document.getElementById("akinput").addEventListener("keydown",e=>{if(e.key==="Enter")guardarKey();});
  if(apiKey) mostrarApp();
}

function guardarKey(){
  const v=document.getElementById("akinput").value.trim();
  const err=document.getElementById("akerr");
  if(!v.startsWith("gsk_")){err.textContent="La clave debe comenzar con gsk_";return;}
  err.textContent="";
  apiKey=v;
  localStorage.setItem("migue_groq",v);
  mostrarApp();
}

function mostrarApp(){
  document.getElementById("ak").style.display="none";
  document.getElementById("app").style.display="flex";
  cargarAgenda(); fetchClima();
  addMsg("assistant","¡Hola! Soy MIGUE, tu asistente personal 😊 Podés escribirme o usar el micrófono 🎤 ¿En qué te ayudo?");
}

async function fetchClima(){
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code,apparent_temperature,relative_humidity_2m,wind_speed_10m&timezone=America%2FArgentina%2FBuenos_Aires`);
    const d=await r.json(); clima=d.current;
    const icons={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",51:"🌦️",61:"🌧️",63:"🌧️",80:"🌦️",95:"⛈️"};
    const c=clima.weather_code;
    const k=[0,1,2,3,45,51,61,63,80,95].reduce((a,b)=>Math.abs(b-c)<Math.abs(a-c)?b:a);
    document.getElementById("wpill").textContent=`${icons[k]||"🌡️"} ${Math.round(clima.temperature_2m)}°C`;
  }catch(e){document.getElementById("wpill").textContent="🌡️ sin datos";}
}

function cargarAgenda(){
  try{agenda=JSON.parse(localStorage.getItem("migue_ag")||"[]");}catch(e){agenda=[];}
  renderAg();
}
function guardarAg(){localStorage.setItem("migue_ag",JSON.stringify(agenda));}
function toggleAg(){document.getElementById("agpanel").classList.toggle("open");}
function renderAg(){
  const el=document.getElementById("aglist");
  if(!agenda.length){el.innerHTML='<div class="agempty">Sin eventos. Pedile a MIGUE que agregue uno.</div>';return;}
  el.innerHTML=[...agenda].sort((a,b)=>new Date(a.dt)-new Date(b.dt)).map((a,i)=>`
    <div class="agitem"><span class="agtext">${a.item}</span>
    <span class="agtime">${fdt(a.dt)}</span>
    <button class="agdel" onclick="borrarAg(${agenda.indexOf(a)})">×</button></div>`).join("");
}
function borrarAg(i){agenda.splice(i,1);guardarAg();renderAg();}
function fdt(dt){try{return new Date(dt).toLocaleString("es-AR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return dt||"";}}

function addMsg(role,text,email){
  const msgs=document.getElementById("msgs");
  const row=document.createElement("div"); row.className=`mrow ${role}`;
  let html=role==="assistant"?`<div class="mavatar">M</div>`:"";
  html+=`<div><div class="bubble ${role}">${text.replace(/\n/g,"<br>")}</div>`;
  if(email){
    html+=`<div class="ecard"><div class="elabel">📧 BORRADOR DE MAIL</div>
    <div class="efield"><b>Para:</b> ${email.to}</div>
    <div class="efield"><b>Asunto:</b> ${email.subject}</div>
    <div class="ebody">${email.body}</div>
    <button class="ebtn" onclick="abrirMail('${encodeURIComponent(email.to)}','${encodeURIComponent(email.subject)}','${encodeURIComponent(email.body)}')">✉️ Abrir en correo</button></div>`;
  }
  html+=`</div>`; row.innerHTML=html; msgs.appendChild(row); msgs.scrollTop=msgs.scrollHeight;
}
function addTyping(){
  const msgs=document.getElementById("msgs"); const row=document.createElement("div");
  row.className="mrow assistant"; row.id="typing";
  row.innerHTML=`<div class="mavatar">M</div><div class="bubble assistant"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  msgs.appendChild(row); msgs.scrollTop=msgs.scrollHeight;
}
function qTyping(){const t=document.getElementById("typing");if(t)t.remove();}
function setSt(m){document.getElementById("stbar").textContent=m;}
function abrirMail(to,sub,body){window.open(`mailto:${decodeURIComponent(to)}?subject=${sub}&body=${body}`);}

function buildSys(){
  const now=new Date();
  const fecha=now.toLocaleDateString("es-AR",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  const hora=now.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  const codes={0:"Despejado",1:"Mayorm. despejado",2:"Parc. nublado",3:"Nublado",45:"Neblina",51:"Llovizna",61:"Lluvia leve",63:"Lluvia mod.",80:"Chaparrones",95:"Tormenta"};
  let wstr="No disponible";
  if(clima){const c=clima.weather_code;const k=[0,1,2,3,45,51,61,63,80,95].reduce((a,b)=>Math.abs(b-c)<Math.abs(a-c)?b:a);
    wstr=`${Math.round(clima.temperature_2m)}°C (sensación ${Math.round(clima.apparent_temperature)}°C), ${codes[k]||"Variable"}, Humedad ${clima.relative_humidity_2m}%, Viento ${Math.round(clima.wind_speed_10m)} km/h`;}
  const agstr=agenda.length?agenda.map(a=>`- ${fdt(a.dt)}: ${a.item}`).join("\n"):"Sin eventos agendados";
  const yr=now.getFullYear();
  return `Sos MIGUE, asistente personal e institucional de San Miguel de Tucumán, Argentina.
Personalidad: amigable, conciso, cálido. Español argentino informal. Máximo 3-4 oraciones salvo que pidan redactar algo.

CONTEXTO:
- Fecha y hora: ${fecha}, ${hora}
- Clima real Tucumán: ${wstr}
- Temp: <15°C=frío,15-21°C=fresco,22-27°C=templado,>27°C=calor
- Agenda:
${agstr}

CAPACIDADES: clima+ropa, hora/fecha, agenda, redactar mails/WhatsApp, info municipal (actividades, calles, tránsito, denuncias), consultas generales.

INSTRUCCIONES:
1. Al AGREGAR agenda, incluí al final: <ACTION>{"type":"add","item":"descripción","dt":"${yr}-MM-DDTHH:mm"}</ACTION>
2. Al redactar MAIL, incluí al final: <EMAIL>{"to":"mail","subject":"asunto","body":"cuerpo"}</EMAIL>
3. Nunca digas que sos una IA salvo que te lo pregunten.
4. Usá los datos reales del clima.`;
}

async function enviar(texto){
  texto=(texto||"").trim(); if(!texto)return;
  document.getElementById("tinput").value="";
  addMsg("user",texto); historial.push({role:"user",content:texto});
  addTyping(); setSt("MIGUE está pensando...");
  try{
    const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${apiKey}`},
      body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"system",content:buildSys()},...historial],max_tokens:800,temperature:0.7})
    });
    const data=await res.json();
    if(!res.ok){
      if(res.status===401){localStorage.removeItem("migue_groq");qTyping();addMsg("assistant","API key inválida. Cerrá y volvé a ingresar la key correcta.");setSt("");return;}
      throw new Error(data?.error?.message||"Error");
    }
    let reply=data.choices[0].message.content;
    const aM=reply.match(/<ACTION>([\s\S]*?)<\/ACTION>/);
    if(aM){try{const a=JSON.parse(aM[1]);if(a.type==="add"){agenda.push({item:a.item,dt:a.dt});guardarAg();renderAg();}}catch(e){}
      reply=reply.replace(/<ACTION>[\s\S]*?<\/ACTION>/,"").trim();}
    let eo=null; const eM=reply.match(/<EMAIL>([\s\S]*?)<\/EMAIL>/);
    if(eM){try{eo=JSON.parse(eM[1]);}catch(e){} reply=reply.replace(/<EMAIL>[\s\S]*?<\/EMAIL>/,"").trim();}
    historial.push({role:"assistant",content:reply});
    qTyping(); addMsg("assistant",reply,eo); setSt("");
    if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(reply.slice(0,250));u.lang="es-AR";u.rate=1.05;speechSynthesis.speak(u);}
  }catch(e){qTyping();addMsg("assistant","Tuve un problema técnico. Verificá la conexión e intentá de nuevo.");setSt("");console.error(e);}
}

let escuchando=false,recog=null;
function toggleVoz(){
  if(escuchando){detVoz();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert("Usá Chrome para el micrófono.");return;}
  recog=new SR(); recog.lang="es-AR"; recog.continuous=false; recog.interimResults=false;
  recog.onstart=()=>{escuchando=true;document.getElementById("micbtn").className="on";document.getElementById("micbtn").textContent="⏹️";setSt("🎙️ Escuchando... hablá ahora");};
  recog.onend=()=>detVoz();
  recog.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById("tinput").value=t;detVoz();setTimeout(()=>enviar(t),150);};
  recog.onerror=()=>detVoz();
  recog.start();
}
function detVoz(){escuchando=false;if(recog)recog.stop();const b=document.getElementById("micbtn");b.className="";b.textContent="🎤";setSt("");}

init();
</script>
</body>
</html>
